  /* ---------- Ruudukon rivikorkeudet ----------
     iOS 12:n Safari ei jaa ruudukon korkeutta tasan riveille, jolloin
     tyhjät paikat litistyvät. Siksi rivien korkeus lasketaan tässä
     pikseleinä ruudukon todellisesta korkeudesta. */
  function mitoitaRuudukko() {
    var rivit = 4;
    var cs = window.getComputedStyle(grid);
    var rako = parseFloat(cs.gridRowGap || cs.rowGap) || 10;
    var korkeus = grid.clientHeight;
    var rivi = Math.max(40, Math.floor((korkeus - rako * (rivit - 1)) / rivit));
    grid.style.gridTemplateRows = 'repeat(' + rivit + ', ' + rivi + 'px)';
    // Padin puolikkaiden kuvakkeet melkein puolikkaan kokoisiksi
    var puolikas = (grid.clientWidth - rako * 3) / 4 / 2;
    var ikoni = Math.floor(Math.min(rivi * 0.95, puolikas * 1.2));
    grid.style.setProperty('--ikoni', ikoni + 'px');
    Naama.mitoita();
  }

  /* ---------- Pitkien nimien vieritys ----------

  var vieritysTyyli = document.createElement('style');

    return;   // lite: ei vieritystä

    Object.keys(els).forEach(function (id) {

      var n = el.querySelector('.nimi');
      var ala = el.querySelector('.nimiAla');
      if (!n || !ala) return;
      n.removeAttribute('data-v');
      ala.classList.remove('vierii');
      var ero = n.offsetWidth - ala.clientWidth;
      if (ero > 2) {
        i++;
        var matka = ero + 6;
        var kesto = Math.max(2.5, matka / 22).toFixed(1);   // noin 22 px sekunnissa
        n.setAttribute('data-v', i);
        ala.classList.add('vierii');
        css += '@keyframes vierii' + i + ' { 0%, 15% { transform: translateX(0); } 85%, 100% { transform: translateX(-' + matka + 'px); } }' +
               '.pad.taysi .nimi[data-v="' + i + '"] { -webkit-animation: vierii' + i + ' ' + kesto + 's ease-in-out infinite alternate; animation: vierii' + i + ' ' + kesto + 's ease-in-out infinite alternate; }';
      }
    });

  }

  /* ---------- Muokkaus ---------- */
  function readFile(file) {
    return new Promise(function (res, rej) {
      var fr = new FileReader();
      fr.onload = function () { res(fr.result); };
      fr.onerror = function () { rej(fr.error); };
      fr.readAsArrayBuffer(file);
    });
  }

  function freeSlotFrom(start) {
    for (var n = 0; n < PAIKKOJA; n++) {
      var i = (start + n) % PAIKKOJA;
      if (!slots[i]) return i;
    }
    return -1;
  }

  fileInput.addEventListener('change', function () {
    var files = Array.prototype.slice.call(fileInput.files);
    fileInput.value = '';
    var chain = Promise.resolve();
    files.forEach(function (file) {
      chain = chain.then(function () {
        var slot = freeSlotFrom(targetSlot);
        if (slot < 0) { alert('All ' + PAIKKOJA + ' pads are full.'); return; }
        return readFile(file).then(function (data) {
          return decode(data).then(function (buf) {
            var p = {
              id: Date.now() + '-' + Math.floor(Math.random() * 1e6),
              name: file.name.replace(/\.[^.]+$/, ''),
              order: slot
            };
            return req('audio', 'readwrite', function (s) { return s.put({ id: p.id, data: data }); })
              .then(function () { return saveMeta(p); })
              .then(function () {
                buffers[p.id] = buf;
                                slots[slot] = p;
                targetSlot = slot + 1;
                render();
              });
          });
        })['catch'](function () {
          alert('Could not read "' + file.name + '". Make sure it is an mp3 file.');

  function rename(p) {

    render();

  function remove(p) {
    if (!confirm('Delete "' + p.name + '"?')) return;
    if (current && current.id === p.id) stopCurrent();
    req('meta', 'readwrite', function (s) { return s['delete'](p.id); });
    req('audio', 'readwrite', function (s) { return s['delete'](p.id); });
    delete buffers[p.id];
    delete peaksCache[p.id];
    slots[p.order] = null;
    render();

  function move(i, d) {
    var j = i + d;
    if (j < 0 || j >= PAIKKOJA) return;
    var t = slots[i]; slots[i] = slots[j]; slots[j] = t;
    if (slots[i]) { slots[i].order = i; saveMeta(slots[i]); }
    if (slots[j]) { slots[j].order = j; saveMeta(slots[j]); }
    if (Math.floor(j / PER_PANKKI) !== bank) bank = Math.floor(j / PER_PANKKI);
    render();

  // VALMIIT LAUSAHDUKSET: muokkaa ja lisää tähän. Uudet lauseet ilmestyvät

  /* ---------- Pikselipää: 50 x 50 ruutua ---------- */
  var Naama = (function () {
    var W = 50, H = 50;
    var el = paa.querySelector('#naama');
    var piirto = el.getContext('2d');
    var nyt = [];
    // Värit (lite piirtää canvasille, joten ne ovat täällä eivätkä CSS:ssä)
    var VARI = {
      0: '#efe4cc', 20: '#4a4440', 21: '#1b140e', 22: '#7d746c', 23: '#8a4a22', 33: '#b0642c',
      24: '#f0a020', 27: '#fff0b0', 31: '#6e4a10', 34: '#ffc53a', 29: '#120c08', 36: '#b8862a',
      37: '#6a625a', 38: '#2a2420'
    };
    function pikseli(x, y, c) { piirto.fillStyle = VARI[c] || VARI[0]; piirto.fillRect(x, y, 1, 1); }

    function sq(v) { return v * v; }
    function pyoreaLaatikko(x, y, x0, x1, y0, y1, r) {
      if (x < x0 || x > x1 || y < y0 || y > y1) return false;
      var cx = Math.min(Math.max(x, x0 + r), x1 - r);
      var cy = Math.min(Math.max(y, y0 + r), y1 - r);
      return sq(x - cx) + sq(y - cy) <= r * r + 0.5;
    }
    // pysyvä "satunnainen" luku ruudulle, ruostepilkkuja varten
    function kohina(x, y) { return Math.abs(((x * 73856093) ^ (y * 19349663)) % 100); }

    /* ---------- Valurautakallo ----------
       Ihmisen kallon muotoinen: kupu, silmäkuopat, nenäaukko ja yläleuka
       hampaineen pysyvät paikallaan. Alaleuka kiertää U:n muotoisena
       yläleuan ympäri, ja sen nousevat haarat kiinnittyvät korvien
       kohdalla messinkisiin hammasratassaranoihin. Puhuessa leuan
       runko laskeutuu ja haarat venyvät saranoista alaspäin. */
    var KX = 24.5;   // kallon keskilinja

    function kalloa(x, y) {
      var dx = x - KX;
      if (y <= 24 && sq(dx / 15.5) + sq((y - 16) / 14.5) <= 1) return true;   // kupu
      if (y >= 17 && y <= 28 && Math.abs(dx) <= (y <= 24 ? 14.5 : 14.5 - (y - 24) * 1.3)) return true;   // poskiluut ja silmien seutu
      if (y >= 28 && y <= 34 && Math.abs(dx) <= 8.5 - (y - 28) * 0.25) return true;   // yläleuka
      return false;
    }

    // Alaleuka: d = kuinka monta pikseliä leuka on auki
    function leuanAlareuna(x, d) { return 41 + d - 4 * sq((x - KX) / 11.5); }
    function alaleukaa(x, y, d) {
      // runko (U-kaari)
      if (x >= 13 && x <= 36) {
        var ala = leuanAlareuna(x, d);
        if (y <= ala && y >= ala - 4) return true;
      }
      // nousevat haarat saranoista leuan kulmiin
      var y0 = 28, y1 = 34 + d;
      if (y >= y0 && y <= y1) {
        var t = (y - y0) / Math.max(1, y1 - y0);
        var xv = 11.5 + t * 2, xo = 37.5 - t * 2;
        if (Math.abs(x - xv) <= 1.2 || Math.abs(x - xo) <= 1.2) return true;
      }
      return false;
    }

    function silma(x, y) {
      var cs = [18, 31];
      for (var i = 0; i < 2; i++) {
        var lamppu = sq(x - cs[i]) + sq(y - 21);
        if (lamppu === 0) return 27;          // kirkas ydin
        if (lamppu <= 2.3) return 24;         // hehku
        if (sq((x - cs[i] - (i ? -0.3 : 0.3)) / 4.4) + sq((y - 21) / 3.9) <= 1) return 29;   // silmäkuoppa
      }
      return 0;
    }

    var introEl = document.getElementById('intro');
    var kuva = document.getElementById('introLogo');
    var logo = document.getElementById('introAlusta');   // liikkuu ja sykkii kuvan kanssa
    var stopNappi = document.getElementById('stop');
    var kaynnissa = false, ajastimet = [];

    function ajasta(fn, ms) { ajastimet.push(setTimeout(fn, ms)); }
    function tyhjenna() { ajastimet.forEach(clearTimeout); ajastimet = []; }

    function lopeta() {
      if (!kaynnissa) return;
      kaynnissa = false;
      tyhjenna();
      introEl.classList.add('pois');
      setTimeout(function () { if (!kaynnissa) introEl.style.display = 'none'; }, 350);
    }

    // logo liukuu STOP-napin kohdalle ja kutistuu sen kokoiseksi
    function siirra() {
      if (!kaynnissa) return;
      logo.classList.remove('syke');
      logo.style.transition = 'none';
      logo.style.opacity = '1';
      logo.style.transform = 'none';
      void logo.offsetWidth;
      var r = logo.getBoundingClientRect();
      var t = stopNappi.getBoundingClientRect();
      var skaala = Math.max(t.width / r.width, t.height / r.height);
      var dx = (t.left + t.width / 2) - (r.left + r.width / 2);
      var dy = (t.top + t.height / 2) - (r.top + r.height / 2);
      logo.style.transition = 'transform .6s cubic-bezier(.7,0,.2,1), opacity .2s ease .5s, box-shadow .6s';
      logo.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(' + skaala + ')';
      logo.style.boxShadow = 'none';
      logo.style.opacity = '0';
      introEl.classList.add('siirto');
      ajasta(lopeta, 720);
    }

    function nayta() {
      var hidasLiike = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (hidasLiike || !(kuva.complete && kuva.naturalWidth)) return;
      tyhjenna();
      kaynnissa = true;
      // palautetaan alkutila
      introEl.classList.remove('siirto', 'pois');
      introEl.style.display = '';
      logo.style.transition = 'none';
      logo.style.transform = '';
      logo.style.opacity = '';
      logo.style.boxShadow = '';
      logo.classList.remove('syke');
      // hehkun animaatio käynnistetään alusta
      introEl.style.animation = 'none';
      void introEl.offsetWidth;
      introEl.style.animation = '';
      logo.classList.add('syke');
      ajasta(siirra, 1250);
      ajasta(lopeta, 4000);                // varmistus: intro ei koskaan jää päälle
    }

    // napautus ohittaa intron
    introEl.addEventListener('touchstart', function (e) { e.preventDefault(); lopeta(); }, { passive: false });
    introEl.addEventListener('click', lopeta);

    // käynnistys: musta ruutu on heti näkyvissä, logo tulee kun kuva on ladattu
    kaynnissa = true;
    if (kuva.complete && kuva.naturalWidth) nayta();
    else {
      kuva.onload = nayta;
      kuva.onerror = lopeta;               // jos kuvaa ei ole, intro ohitetaan
      ajasta(lopeta, 2500);
    }

    // paluu taustalta tai muistista
    var piilossaAlkaen = 0;
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) piilossaAlkaen = Date.now();
      else if (piilossaAlkaen && Date.now() - piilossaAlkaen > PALUU_SEK * 1000) nayta();
    });
    window.addEventListener('pageshow', function (e) { if (e.persisted) nayta(); });
  })();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js')['catch'](function () {});
  }
})();
</script>
</body>
</html>
